name: Auto Spotless
on:
  push:
    branches: '**'

permissions:
  contents: write

jobs:
  spotless:
    runs-on: 'ubuntu-26.04'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Auto format
        run: ./gradlew spotlessApply

      - name: Apply formatting
        run: |
          git config user.name "ddCeka"
          git config user.email "57752215+ddCeka@users.noreply.github.com"
          
          # NOTE: ONLY stage the exact source files Spotless targets.
          git add -u -- '*.kt' 2>/dev/null || true
          git add -u -- '*.kts' 2>/dev/null || true
          git add -u -- '*.xml' 2>/dev/null || true
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Fix Spotless formatting [skip ci]"
            git push origin HEAD
          else
            echo "No changes detected"
          fi
