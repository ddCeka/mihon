name: Auto Spotless
on:
  push:
    branches: '**'
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - '.editorconfig'

permissions:
  contents: write

concurrency:
  group: spotless-${{ github.ref }}
  cancel-in-progress: false

jobs:
  spotless:
    runs-on: 'ubuntu-26.04'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Auto format
        run: ./gradlew spotlessApply --no-daemon

      - name: Commit & push formatting
        run: |
          git config user.name "ddCeka"
          git config user.email "57752215+ddCeka@://github.com"

          # Stage only tracked source files that Spotless formats
          git add -u -- '*.kt' '*.kts' '*.xml' 2>/dev/null || true

          if ! git diff-index --quiet HEAD; then
            git commit -m "Fix Spotless formatting [skip ci]"
            # Pull with rebase first in case an external push landed mid-run
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "No changes detected"
          fi

      - name: Verify formatting
        run: ./gradlew spotlessCheck --no-daemon
